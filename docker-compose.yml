version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mockstalk-mysql
    environment:
      MYSQL_DATABASE: mockstalk
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - mockstalk-net

  redis:
    image: redis:7
    container_name: mockstalk-redis
    ports:
      - "6379:6379"
    networks:
      - mockstalk-net

  rabbitmq:
    image: rabbitmq:3-management
    container_name: mockstalk-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"  # RabbitMQ Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - mockstalk-net

  app:
    image: mockstalk-app:latest
    container_name: mockstalk-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: mockstalk
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-change-me}
      ACCOUNT_JWT_SECRET: ${ACCOUNT_JWT_SECRET:-local-dev-account-jwt-secret}
      HANTU_APPKEY: ${HANTU_APPKEY:-}
      HANTU_APPSECRET: ${HANTU_APPSECRET:-}
      HANTU_ACCESS_TOKEN: ${HANTU_ACCESS_TOKEN:-}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
    depends_on:
      - mysql
      - redis
      - rabbitmq
    networks:
      - mockstalk-net

volumes:
  mysql-data:

networks:
  mockstalk-net: